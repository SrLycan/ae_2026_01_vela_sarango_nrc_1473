# Gateway único: es el ÚNICO servicio que docker-compose.yml expone al host.
# users y spotsapp usan "expose" (solo visibles dentro de la red de Docker), no "ports" —
# nadie de afuera puede pegarle directo a esos dos, todo pasa por acá.
#
# Enrutamos por prefijo de path. "/api/users/" es más específico que "/" y nginx hace
# "longest prefix match", así que gana sobre el catch-all sin importar el orden en que
# aparezcan los bloques.

upstream users_service {
    server users:8686;
}

upstream spotsapp_service {
    server spotsapp:8080;
}

upstream pgadmin_service {
    server pgadmin:80;
}

server {
    listen 80;

    # Tamaño máximo de body: las fotos van directo a S3 vía presigned URL (ADR-001),
    # así que el backend nunca recibe el archivo en sí — el default de nginx alcanza
    # de sobra para los JSON de esta API.

    location /api/users/ {
        proxy_pass         http://users_service;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Explorador de BD (pgAdmin) — visible desde la IP pública del EC2, protegido por su
    # propio login (PGADMIN_PASSWORD en .env). X-Script-Name es lo que le dice a pgAdmin
    # que está sirviendo bajo /pgadmin/ y no en la raíz (ver PGADMIN_CONFIG_APPLICATION_ROOT
    # en docker-compose.yml — los dos valores tienen que coincidir).
    location /pgadmin/ {
        proxy_pass          http://pgadmin_service/;
        proxy_set_header    X-Script-Name /pgadmin;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_redirect      off;
    }

    # Todo lo demás (/spots, /categories, /media, /reviews, /follows, /feed, /profile, ...)
    # va al microservicio de dominio del proyecto.
    location / {
        proxy_pass         http://spotsapp_service;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
